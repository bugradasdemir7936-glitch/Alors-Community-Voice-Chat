<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Alors Community</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: üstte marka + kategori sekmeleri + profil, altında alt sekmeler, ortada tek sütun sohbet (baloncuklu). */
:root{
  --bg:#000000;--glass:rgba(8,12,16,.7);--panel:#0c0f14;--panel2:#161a22;--line:#242a35;
  --ink:#eef1f6;--mute:#8d96a6;
  --accent:#e2b53a;--accent-ink:#1a1303;--mod:#7cc4ff;--mod-bg:#10263a;
  --gold:#f0c24b;--gold-bg:#3a2f10;--ok:#4cc38a;--danger:#ff7070;
  --f-display:'Chakra Petch','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--f-body);overflow:hidden}
h1,h2,h3,p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Kabuk */
.app{height:100%;display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:8px 24px;padding:8px 16px 0;background:var(--glass);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font:700 1.05rem var(--f-display);letter-spacing:.12em;display:flex;align-items:center;gap:10px;white-space:nowrap;padding-bottom:8px}
.blogo{height:52px;width:auto;display:block;flex:none;filter:drop-shadow(0 0 6px rgba(226,181,58,.35)) brightness(1.2)}
.brand span{color:var(--accent)}
.cats{display:flex;gap:2px;flex:1;min-width:0;overflow-x:auto;align-self:stretch;align-items:flex-end}
.cat{padding:10px 16px 9px;border:0;border-bottom:3px solid transparent;background:transparent;font:700 .78rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);cursor:pointer;white-space:nowrap}
.cat:hover{color:var(--ink)}
.cat.on{color:var(--ink);border-bottom-color:var(--accent)}
.cnt{display:inline-block;margin-left:7px;background:var(--accent);color:var(--accent-ink);font:700 .68rem var(--f-mono);padding:1px 7px;border-radius:99px;letter-spacing:0}
.topright{margin-left:auto;position:relative;padding-bottom:8px}
.pbtn{display:flex;align-items:center;gap:8px;padding:3px 12px 3px 3px;border:1px solid var(--line);border-radius:99px;background:var(--panel);cursor:pointer;max-width:200px}
.pbtn:hover{border-color:var(--accent)}
.pbtn .pn{font-weight:600;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% - 2px);width:230px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);z-index:6}
.mrow{display:flex;align-items:center;gap:10px;min-width:0}
.mrow .nm{display:flex;flex-direction:column;gap:4px;min-width:0}
.mrow strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .tg{display:flex;gap:4px;flex-wrap:wrap}

.announce{padding:9px 16px;background:var(--gold-bg);color:var(--gold);font-weight:600;font-size:.88rem;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.announce b{font:700 .66rem var(--f-mono);letter-spacing:.08em;margin-right:8px}
.subs{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.subs h1{font:700 1.05rem var(--f-display);letter-spacing:.03em}
.pill{padding:6px 15px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font:600 .85rem var(--f-body);cursor:pointer;color:var(--ink)}
.pill:hover{border-color:var(--accent)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.on .cnt{background:var(--accent-ink);color:var(--accent)}
.onchip{margin-left:auto}
.viewbody{flex:1;min-height:0;display:flex;flex-direction:column}
.sw{flex:1;min-height:0;overflow-y:auto}
.scroll{width:100%;max-width:900px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}

/* Ortak parçalar */
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 .95rem var(--f-display);flex:none}
.av.sm{width:28px;height:28px;font-size:.8rem}
.tag{font:700 .6rem var(--f-mono);letter-spacing:.07em;padding:2px 6px;border-radius:4px;text-transform:uppercase;white-space:nowrap}
.tag.founder{background:var(--accent);color:var(--accent-ink)}
.tag.mod{background:var(--mod-bg);color:var(--mod)}
.tag.tr{border:1px solid var(--line);color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--ok)}
.chip{font:600 .72rem var(--f-body);padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:currentColor}
.chip.bad{color:var(--danger);border-color:currentColor}
.mute{color:var(--mute)}
.btn{padding:.45rem .85rem;border:1px solid var(--line);background:var(--panel);border-radius:8px;font:600 .84rem var(--f-body);cursor:pointer;color:var(--ink);white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn.sm{padding:.25rem .6rem;font-size:.78rem}
.btn[aria-pressed="true"]{background:var(--gold-bg);color:var(--gold);border-color:var(--gold)}
input[type=text],input[type=password],textarea{width:100%;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:.6rem .75rem;color:var(--ink)}
input[type=text]:disabled{opacity:.6}
textarea{resize:vertical;min-height:84px}
label.row{display:flex;align-items:center;gap:10px;font-weight:600}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:10px}

/* Sohbet: baloncuklar */
.chatcol{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;max-width:900px;margin:0 auto}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:min(640px,100%)}
.msg.mine{flex-direction:row-reverse;align-self:flex-end}
.bub{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 12px;min-width:0}
.msg.mine .bub{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);border-radius:14px 14px 4px 14px}
.mh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mh strong{font-weight:700;font-size:.9rem}
.mh time{font:500 .68rem var(--f-mono);opacity:.7}
.msg.mine .tag{background:rgba(255,255,255,.25);color:var(--accent-ink);border:0}
.bub p{overflow-wrap:anywhere;white-space:pre-wrap}
.macts{display:flex;gap:6px;margin-top:6px;opacity:0}
.msg:hover .macts,.msg:focus-within .macts{opacity:1}
@media (hover:none){.macts{opacity:1}}
.composer{display:flex;gap:8px;padding:12px 16px}
.cnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 16px;padding:8px 12px;background:var(--panel2);border-radius:8px;font-size:.86rem}

/* Listeler */
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:10px 12px;border:1px solid var(--line);background:var(--panel);border-radius:10px}
.pcard .who{min-width:0;display:flex;flex-direction:column;gap:2px}
.pcard .top2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pcard .top2 strong{overflow-wrap:anywhere}
.pcard .sub{font-size:.82rem;color:var(--mute);overflow-wrap:anywhere}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.perms{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.perms .lab{font:700 .66rem var(--f-mono);letter-spacing:.08em;color:var(--mute);text-transform:uppercase;margin-right:4px}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.confirm .rin{width:170px;padding:.3rem .5rem;font-size:.8rem}
.cnote2{font-size:.78rem;color:var(--danger);font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font:700 .72rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.stats{display:flex;gap:10px 28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font:700 1.5rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--mute)}
.fform{display:flex;gap:8px}
.pform{max-width:520px;display:flex;flex-direction:column;gap:16px}
.pform .lab{font:700 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);display:block;margin-bottom:6px}
.pform .err{color:var(--danger);font-weight:600;font-size:.88rem;min-height:1.2em}
.prow{display:flex;align-items:center;gap:12px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.swb[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:2px}
.btns{display:flex;gap:8px;flex-wrap:wrap}

/* Giriş ekranları */
#gate{height:100%;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 38%,rgba(226,181,58,.13),transparent 62%);overflow-y:auto}
.gcard{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.gcard .brand{padding:0;flex-direction:column;align-items:flex-start;gap:12px}
.gcard .blogo{height:120px}
.gcard h2{font:700 1.3rem var(--f-display);letter-spacing:.02em}
.gcard p{color:var(--mute)}
.gcard .err{color:var(--danger);font-weight:600;min-height:1.2em;font-size:.88rem}
.gcard small{color:var(--mute);font-size:.8rem}


/* Yıldız noktaları: iki katman, biri yavaşça parlıyor */
body::before,body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-repeat:repeat}
body::before{
  background-image:
    radial-gradient(1.3px 1.3px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 90px 70px,rgba(255,255,255,.85),transparent),
    radial-gradient(1.6px 1.6px at 160px 20px,#ffe7a3,transparent),
    radial-gradient(1px 1px at 130px 150px,rgba(255,255,255,.75),transparent),
    radial-gradient(1.3px 1.3px at 50px 120px,#c9d8ff,transparent);
  background-size:200px 200px,230px 230px,270px 270px,310px 310px,350px 350px}
body::after{
  background-image:
    radial-gradient(1.6px 1.6px at 40px 60px,#fff,transparent),
    radial-gradient(1.2px 1.2px at 140px 110px,#ffe7a3,transparent),
    radial-gradient(1.4px 1.4px at 210px 30px,rgba(255,255,255,.9),transparent);
  background-size:260px 260px,330px 330px,390px 390px;
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.15}to{opacity:1}}
.app,#gate{position:relative;z-index:1}
a.btn{text-decoration:none;display:inline-block}
.vci{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);font:700 .66rem var(--f-mono);letter-spacing:.06em;flex:none}
.vmem{display:flex;gap:6px 10px;flex-wrap:wrap;align-items:center;margin-top:6px}
.vmem .m{display:flex;align-items:center;gap:6px;font-size:.84rem}
.vedit{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--line)}
.vedit input{flex:1;min-width:180px;padding:.35rem .6rem;font-size:.82rem}

.vnotice{background:rgba(124,196,255,.12);color:var(--mod);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vnotice .btn{color:var(--accent-ink)}
.vnotice .btn:not(.primary){color:var(--ink)}

/* Karşılama ve kayıt geçişi */
.hero{width:min(780px,100%);display:flex;flex-direction:row;align-items:center;gap:40px;padding:8px}
.herologo{height:min(56vh,360px);width:auto;flex:none;filter:drop-shadow(0 0 30px rgba(226,181,58,.28))}
.herotext{display:flex;flex-direction:column;gap:22px;min-width:0;flex:1}
@media (max-width:639px){.hero{flex-direction:column;align-items:flex-start;gap:16px}.herologo{height:190px}}
.hero h2{font:700 clamp(1.9rem,7vw,2.8rem)/1.06 var(--f-display);letter-spacing:.01em}
.hero p{color:var(--mute);font-size:1.02rem;max-width:46ch}
.btn.big{padding:.8rem 1.7rem;font-size:1rem;align-self:flex-start;border-radius:10px}
.gin{animation:gin .42s ease both}
.gout{animation:gout .22s ease both}
@keyframes gin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes gout{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-10px)}}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font:700 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.linkb{background:none;border:0;color:var(--mute);font:600 .85rem var(--f-body);cursor:pointer;padding:0;align-self:flex-start}
.linkb:hover{color:var(--ink)}
.regprompt{color:var(--mute);font-size:.95rem;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.linkb.reg{color:var(--accent);font-weight:700;font-size:.95rem}
.linkb.reg:hover{color:var(--accent);text-decoration:underline}

#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;font-size:.88rem;max-width:calc(100% - 32px);z-index:10;text-align:center}

@media (max-width:759px){
  .top{gap:0 12px}
  .cats{order:3;flex-basis:100%;flex:none;width:100%}
  .cat{padding:10px 12px 9px}
  .pcard{grid-template-columns:auto minmax(0,1fr)}
  .pcard .acts,.pcard .confirm{grid-column:1/-1;justify-content:flex-start}
}
@media (max-width:480px){.pbtn .pn{display:none}.pbtn{padding-right:3px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="gate"></div>
<div class="app" id="shell" hidden>
  <header class="top">
    <div class="brand"><img class="blogo" id="hdrLogo" alt=""><span>ALORS COMMUNITY</span></div>
    <nav class="cats" id="cats" aria-label="Kategoriler"></nav>
    <div class="topright" id="meBox"></div>
  </header>
  <div class="announce" id="announce" hidden></div>
  <div class="announce vnotice" id="vnotice" hidden></div>
  <div class="subs" id="subs"></div>
  <section class="viewbody" id="viewBody"></section>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

const h=(t,a={},...c)=>{
  const e=document.createElement(t);
  for(const k in a){
    const v=a[k];
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const x of c.flat()){
    if(x==null||x===false)continue;
    e.append(x.nodeType?x:document.createTextNode(String(x)));
  }
  return e;
};

const S={
  db:null,user:null,room:null,uid:null,isOwner:false,canWrite:null,

};

const NICK_RE=/^[0-9A-Za-zÇĞİÖŞÜçğıöşü_-]{3,16}$/;
const HUES=[40,48,28,12,200,265,330,150];
const keyOf=n=>n.toLocaleLowerCase('tr').replace(/ç/g,'c').replace(/ğ/g,'g').replace(/ı/g,'i').replace(/ö/g,'o').replace(/ş/g,'s').replace(/ü/g,'u').replace(/[^a-z0-9_-]/g,'');
const hue=s=>{let n=0;for(const ch of String(s))n=(n*31+ch.charCodeAt(0))>>>0;return HUES[n%HUES.length]};
const fmtT=ts=>new Date(ts).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const fmtD=ts=>ts?new Date(ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';

const isAdmin=()=>S.isOwner;
const isMod=u=>!!(S.roles[u]&&S.roles[u].role==='mod');
const perm=p=>isAdmin()||(isMod(S.uid)&&!!(S.roles[S.uid].perms&&S.roles[S.uid].perms[p]));
const canManage=()=>isAdmin()||perm('announce')||perm('mute');
const roleOf=u=>{
  if(u&&(u===S.founderUid||(S.isOwner&&u===S.uid)))return'founder';
  return isMod(u)?'mod':null;
};
const nickOf=u=>S.profiles[u]?S.profiles[u].nick:'Silinmiş oyuncu';
const visibleUids=()=>Object.keys(S.profiles).filter(u=>isAdmin()||!S.bans[u]);
const onlineSet=()=>{
  const s=new Set();
  for(const p of S.peers){
    if(p.kind!=='viewer'||(p.presence&&p.presence.out))continue;
    const u=p.by||(p.presence&&p.presence.uid);
    if(typeof u==='string')s.add(u);
  }
  return s;
};

const RESERVED=['ses','oyuncular','arkadaslar','kurucu','profil'];
const DEF_CHAT=[
  {id:'genel',t:'Genel Sohbet',s:'Tüm oyuncuların ortak odası',tr:false},
  {id:'tr',t:'Türkiye Sohbeti',s:"Türkiye'den bağlanan oyuncular için",tr:true}
];
const DEF_VOICE=[
  {id:'genel',t:'Genel Ses',s:'Herkesin girebildiği ortak oda',tr:false},
  {id:'tr',t:'Türkiye Ses',s:"Türkiye'den bağlanan oyuncular için",tr:true},
  {id:'oyun',t:'Oyun Odası',s:'Birlikte oynayanlar için',tr:false}
];
function cleanList(l){
  return Array.isArray(l)?l.filter(c=>c&&typeof c.id==='string'&&/^[a-z0-9_-]{1,40}$/.test(c.id)&&!RESERVED.includes(c.id)&&typeof c.t==='string'&&c.t.trim())
    .map(c=>({id:c.id,t:c.t.slice(0,24),s:typeof c.s==='string'?c.s.slice(0,80):'',tr:!!c.tr})):[];
}
const cleanChan=d=>({chat:cleanList(d&&d.chat),voice:cleanList(d&&d.voice)});
const chatCh=()=>S.chan.chat&&S.chan.chat.length?S.chan.chat:DEF_CHAT;
const voiceCh=()=>S.chan.voice&&S.chan.voice.length?S.chan.voice:DEF_VOICE;
const isChat=v=>chatCh().some(c=>c.id===v);
const chanTitle=id=>{const c=chatCh().find(x=>x.id===id);return c?c.t:'Sohbet'};
function syncMsgSubs(){
  const ids=chatCh().map(c=>c.id);
  for(const id of ids){
    if(S.msgUnsub[id])continue;
    if(!S.msgs[id])S.msgs[id]=[];
    S.msgUnsub[id]=S.db.collection('msg_'+id).orderBy('ts','desc').limit(80).onSnapshot(sn=>{
      S.msgs[id]=sn.docs.map(d=>({id:d.id,...d.data()})).reverse();
      if(S.shellOn&&S.view===id)updateChat();
      if(S.shellOn&&S.view==='kurucu')updatePanel();
    },e=>{S.err=e;decide()});
  }
  for(const id of Object.keys(S.msgUnsub)){
    if(!ids.includes(id)){S.msgUnsub[id]();delete S.msgUnsub[id];delete S.msgs[id]}
  }
}

let tt;

function errText(e){
  const c=e&&e.code;
  if(c==='invalid_argument')return'Bu işlem için yetkin yok.';
  if(c==='quota_exceeded')return'Depolama dolu. Kurucu eski mesajları temizlemeli.';
  if(c==='resource_exhausted')return'Çok hızlı işlem yaptın, biraz bekle.';
  if(c==='revoked')return'Bağlantı yetkin kaldırıldı.';
  return'İşlem tamamlanamadı. Tekrar dene.';
}
async function run(fn,ok){try{await fn();if(ok)toast(ok)}catch(e){toast(errText(e))}}

  e.style.background=`hsl(${hv} 52% 40%)`;

}

function tags(uid){
  const r=roleOf(uid),p=S.profiles[uid],out=[];

  if(p&&p.tr)out.push(h('span',{class:'tag tr',text:'TR'}));

}

function showGate(kind){
  if(S.gateKind===kind&&!$('#gate').hidden)return;
  S.shellOn=false;S.gateKind=kind;
  $('#shell').hidden=true;
  const g=$('#gate');g.hidden=false;
  let card;
  if(kind==='loading'){
    card=h('div',{class:'gcard'},brandEl(),h('h2',{text:'Bağlanılıyor'}),h('p',{text:'Oyuncular ve sohbet odaları yükleniyor.'}));
  }else if(kind==='closed'){
    card=h('div',{class:'gcard'},brandEl(),h('h2',{text:'Giriş gerekli'}),
      h('p',{text:'Alors Community, claude.ai hesabınla giriş yaptığında çalışır. Bu sayfayı claude.ai üzerinden, oturumun açıkken aç.'}));
  }else if(kind==='readonly'){
    card=h('div',{class:'gcard'},brandEl(),h('h2',{text:'Salt okunur erişim'}),
      h('p',{text:'Bu sayfada yazma yetkin yok. Kurucudan Katılımcı (Contributor) erişimi iste.'}));
  }else if(kind==='banned'){
    const b=S.bans[S.uid]||{};
    card=h('div',{class:'gcard'},brandEl(),h('h2',{text:'Hesabın banlandı'}),
      h('p',{text:b.reason?`Sebep: ${b.reason}`:'Kurucu bu hesabın girişini kapattı.'}));
  }else if(kind==='welcome'){
    card=h('div',{class:'hero gin'},
      h('img',{class:'herologo',src:LOGO,alt:'Alors Community'}),
      h('div',{class:'herotext'},
        h('h2',{text:'Oyuncuların buluşma noktası'}),
        h('p',{text:'Alors Community, oyuncuların bir araya geldiği yeni bir topluluk. Genel sohbette herkesle, Türkiye sohbetinde Türk oyuncularla konuş. Yeni arkadaşlar edin, ses kanallarında canlı konuş.'}),
        h('button',{type:'button',class:'btn primary big',id:'joinBtn',onclick:()=>{
          const el=$('#gate .hero');if(el)el.classList.add('gout');
          setTimeout(()=>{S.loginStep=true;S.gateKind=null;showGate('login')},220);
        },text:'Hemen Başla'})));
  }else if(kind==='login'){

function logout(){
  S.menuOpen=false;S.loggedOut=true;S.myVc=null;S.notice=null;
  try{localStorage.setItem('alors_out_'+S.uid,'1')}catch(e){}
  if(S.room)S.room.presence({out:true,vc:null}).catch(()=>{});
  S.gateKind=null;showGate('login');
}
const toHex=a=>[...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function verifyCred(pw){
  const d=await S.db.collection('data/users/'+S.uid).doc('cred').get();
  if(!d.exists)return null;
  const c=d.data();
  if(!(window.crypto&&crypto.subtle)||typeof c.salt!=='string'||typeof c.hash!=='string')return null;
  const salt=new Uint8Array((c.salt.match(/../g)||[]).map(x=>parseInt(x,16)));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:c.iter||100000,hash:'SHA-256'},key,256);
  return toHex(bits)===c.hash;
}
async function doLogin(e){
  e.preventDefault();
  const err=$('#logErr'),b=$('#logBtn');err.textContent='';
  const p=S.profiles[S.uid],n=$('#logNick').value.trim(),pw=$('#logPw').value;
  if(!p){err.textContent='Bu hesapla kayıtlı kullanıcı yok. Aşağıdan hemen kayıt ol.';return}
  b.disabled=true;
  try{
    const okNick=!!p&&keyOf(n)===(p.key||keyOf(p.nick));
    const r=await verifyCred(pw);
    if(!okNick||r===false){err.textContent='Kullanıcı adı veya şifre yanlış.';return}
    S.loggedOut=false;
    try{localStorage.removeItem('alors_out_'+S.uid)}catch(x){}
    if(S.room)S.room.presence({out:null,uid:S.uid}).catch(()=>{});
    S.gateKind=null;decide();
  }catch(x){err.textContent=errText(x)}
  finally{b.disabled=false}
}

async function saveCred(pw){
  if(!(window.crypto&&crypto.subtle))return;
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},key,256);
  const hex=a=>[...new Uint8Array(a)].map(x=>x.toString(16).padStart(2,'0')).join('');
  await S.db.collection('data/users/'+S.uid).doc('cred').set({salt:hex(salt),hash:hex(bits),iter:100000,ts:Date.now()});
}

async function claimNick(nick){
  const key=keyOf(nick);
  const slot=S.db.doc('nicks/'+key);
  const lease=await slot.acquire({holder:S.uid,ttlMs:5000});
  if(!lease.acquired)return{ok:false,msg:'Bu ad şu an başka biri tarafından alınıyor. Birkaç saniye sonra tekrar dene.'};
  const cur=await slot.get();
  const d=cur.exists?cur.data():null;
  if(d&&d.uid&&d.uid!==S.uid)return{ok:false,msg:'Bu oyun adı alınmış. Başka bir ad dene.'};
  await slot.set({uid:S.uid,nick});
  return{ok:true,key};
}

async function register(e){
  e.preventDefault();
  const err=$('#regErr'),b=$('#regBtn');
  const nick=$('#nickIn').value.trim(),p1=$('#pw1').value,p2=$('#pw2').value;
  err.textContent='';
  if(!NICK_RE.test(nick)){err.textContent='Kullanıcı adı 3-16 karakter olmalı; harf, rakam, _ ve - kullanabilirsin.';return}
  if(keyOf(nick).length<3){err.textContent='Bu ad çok kısa. Daha fazla harf veya rakam ekle.';return}
  if(p1.length<6){err.textContent='Şifre en az 6 karakter olmalı.';return}
  if(p1!==p2){err.textContent='Şifreler aynı değil. İkisine de aynı şifreyi yaz.';return}
  b.disabled=true;
  try{
    const r=await claimNick(nick);
    if(!r.ok){err.textContent=r.msg;return}
    await saveCred(p1).catch(()=>{});
    await S.db.doc('profiles/'+S.uid).set({nick,key:r.key,tr:false,bio:'',createdAt:Date.now()});
  }catch(x){err.textContent=errText(x)}
  finally{b.disabled=false}
}

/* ---------- Kabuk ---------- */
function decide(){
  if(S.err){S.gateKind=null;return showGate('closed')}
  if(!S.loaded.profiles||!S.loaded.bans)return;
  if(S.bans[S.uid]&&!S.isOwner)return showGate('banned');
  if(S.canWrite===false)return showGate('readonly');
  if(!S.profiles[S.uid])return showGate(S.joining?'register':(S.loginStep?'login':'welcome'));
  if(S.loggedOut)return showGate('login');
  showShell();
}
function showShell(){
  const first=!S.shellOn;
  S.shellOn=true;S.gateKind=null;
  $('#gate').hidden=true;$('#shell').hidden=false;
  if(first){
    startRoom();
    if(S.view==='kurucu'&&!canManage())S.view='genel';
    renderChrome();
    buildView();
  }else{
    if(S.view==='kurucu'&&!canManage()){setView('genel');return}
    refresh();
  }
}
function startRoom(){
  if(!S.room||S.roomOn)return;
  S.roomOn=true;
  S.room.presence({uid:S.uid}).catch(()=>{});
  S.room.onPeers(c=>{
    S.peers=c.peers;
    if(!S.shellOn)return;
    renderSubs();
    if(S.view==='ses')updateVoice();
    if(S.view==='oyuncular')updatePlayers();
    if(S.view==='arkadaslar')updateFriends();
    if(S.view==='kurucu')updatePanel();
  },()=>{});
}
function setView(v){

}
function renderChrome(){renderCats();renderSubs();renderMe();renderAnnounce();renderNotice()}
function refresh(){

function buildView(){

function lockReason(ch){
  const mu=S.mutes[S.uid];
  if(mu&&mu.until>Date.now())return`Susturuldun. Kalan süre: ${Math.max(1,Math.ceil((mu.until-Date.now())/60000))} dk.`;
  const cc=chatCh().find(x=>x.id===ch);
  if(cc&&cc.tr&&!(S.profiles[S.uid]&&S.profiles[S.uid].tr))return'tr';
  return null;
}
function buildChat(ch){
  const input=h('input',{type:'text',id:'msgIn',maxlength:'400',autocomplete:'off',placeholder:'#'+chanTitle(ch)+' kanalına yaz…','aria-label':'Mesaj'});
  const form=h('form',{class:'composer',id:'composer'},input,h('button',{class:'btn primary',type:'submit',id:'sendBtn',text:'Gönder'}));
  form.addEventListener('submit',ev=>{ev.preventDefault();send(ch)});
  body().replaceChildren(h('div',{class:'chatcol'},
    h('div',{class:'msgs',id:'msgs',role:'log','aria-live':'polite'}),
    h('div',{class:'cnote',id:'cnote',hidden:true}),
    form));
  updateChat(true);
}
function updateLock(){
  const note=$('#cnote');if(!note)return;
  const ch=S.view;if(!isChat(ch))return;
  const r=lockReason(ch);
  note.hidden=!r;
  if(r==='tr'){
    note.replaceChildren("Bu odaya girmek için profilinde Türkiye'den bağlandığını işaretlemelisin.",
      btn("Türkiye'denim",()=>run(()=>S.db.doc('profiles/'+S.uid).update({tr:true}),'Türkiye sohbetine hoş geldin.'),'primary'));
  }else if(r){note.replaceChildren(r)}
  $('#msgIn').disabled=!!r;$('#sendBtn').disabled=!!r;
}
function updateChat(forceBottom){
  const ch=S.view;if(!isChat(ch))return;
  const box=$('#msgs');if(!box)return;
  const stick=forceBottom||box.scrollHeight-box.scrollTop-box.clientHeight<90;
  const list=S.msgs[ch]||[];
  box.replaceChildren(...(list.length?list.map(m=>msgRow(ch,m)):[h('div',{class:'empty',text:'Henüz mesaj yok. İlk mesajı sen yaz.'})]));
  if(stick)box.scrollTop=box.scrollHeight;
  updateLock();
}
function msgRow(ch,m){
  const mine=m.uid===S.uid;
  const nick=S.profiles[m.uid]?S.profiles[m.uid].nick:(m.nick||'Silinmiş oyuncu');
  const acts=[];
  if(mine||perm('delete'))acts.push(btn('Sil',()=>run(()=>S.db.doc(`msg_${ch}/${m.id}`).delete()),'danger'));
  if(!mine&&perm('mute')&&roleOf(m.uid)!=='founder'&&!(isMod(m.uid)&&!isAdmin()))
    acts.push(btn('10 dk sustur',()=>run(()=>S.db.doc('mutes/'+m.uid).set({until:Date.now()+600000,by:S.uid,nick}),`${nick} 10 dakika susturuldu.`)));
  return h('article',{class:'msg'+(mine?' mine':'')},
    avatar(m.uid,nick,true),
    h('div',{class:'bub'},
      h('div',{class:'mh'},h('strong',{text:nick}),...tags(m.uid),h('time',{text:fmtT(m.ts)})),
      h('p',{text:m.text}),
      acts.length?h('div',{class:'macts'},...acts):null));
}
async function send(ch){
  const input=$('#msgIn');if(!input)return;
  const text=input.value.trim();
  if(!text||lockReason(ch))return;
  if(Date.now()-S.lastSent<1200){toast('Biraz yavaş. Mesajlar arasında kısa bir ara ver.');return}
  S.lastSent=Date.now();input.value='';
  try{
    await S.db.collection('msg_'+ch).add({uid:S.uid,nick:nickOf(S.uid),text:text.slice(0,400),ts:Date.now()});
  }catch(e){input.value=text;toast(errText(e))}
}

const vLink=id=>vValid(S.vlinks&&S.vlinks[id])?S.vlinks[id]:'https://meet.jit.si/AlorsCommunity-'+id;
function vMembers(id){

  for(const p of S.peers){
    if(p.kind!=='viewer'||!p.presence||p.presence.vc!==id)continue;
    const u=p.by||p.presence.uid;
    if(typeof u==='string'&&S.profiles[u]&&(isAdmin()||!S.bans[u]))set.add(u);
  }
  return[...set];
}
function setVc(id){

  if(S.room)S.room.presence({vc:id}).catch(()=>{});

function applyAssign(){
  const a=S.vassign[S.uid];
  if(!a||typeof a.ts!=='number')return;
  let seen=S.assignSeen;
  try{seen=Math.max(seen,+localStorage.getItem('alors_assign_'+S.uid)||0)}catch(e){}
  if(a.ts<=seen)return;
  S.assignSeen=a.ts;
  try{localStorage.setItem('alors_assign_'+S.uid,String(a.ts))}catch(e){}
  const c=a.vc&&voiceCh().find(x=>x.id===a.vc);
  if(c){
    S.myVc=c.id;S.notice={id:c.id,t:c.t};
    if(S.room)S.room.presence({vc:c.id}).catch(()=>{});

    S.myVc=null;S.notice=null;

  renderNotice();

/* ---------- Arkadaşlık ---------- */
function fstate(u){
  const o=S.freqOut.find(f=>f.to===u),i=S.freqIn.find(f=>f.from===u);
  if(o&&o.status==='accepted')return{s:'friends',id:o.id};
  if(i&&i.status==='accepted')return{s:'friends',id:i.id};
  if(o)return{s:'out',id:o.id};
  if(i)return{s:'in',id:i.id};
  return{s:'none'};
}
const addFriend=u=>run(()=>S.db.doc(`freq/${S.uid}_${u}`).set({from:S.uid,to:u,status:'pending',ts:Date.now()}),'Arkadaşlık isteği gönderildi.');
const acceptF=id=>run(()=>S.db.doc('freq/'+id).update({status:'accepted'}),'Artık arkadaşsınız.');
const dropF=(id,m)=>run(()=>S.db.doc('freq/'+id).delete(),m);

function friendActions(u){
  const f=fstate(u);
  if(f.s==='friends')return[h('span',{class:'chip ok',text:'Arkadaşsınız'}),btn('Çıkar',()=>dropF(f.id,'Arkadaşlıktan çıkarıldı.'))];
  if(f.s==='out')return[h('span',{class:'chip',text:'İstek gönderildi'}),btn('Geri al',()=>dropF(f.id,'İstek geri alındı.'))];
  if(f.s==='in')return[btn('Kabul et',()=>acceptF(f.id),'primary'),btn('Reddet',()=>dropF(f.id,'İstek reddedildi.'))];
  return[btn('Arkadaş ekle',()=>addFriend(u),'primary')];
}

function buildPlayers(){

function updateFriends(){
  const box=$('#fbox');if(!box)return;
  const all=[...S.freqOut.map(f=>({...f,other:f.to,dir:'out'})),...S.freqIn.map(f=>({...f,other:f.from,dir:'in'}))].filter(f=>S.profiles[f.other]&&(isAdmin()||!S.bans[f.other]));

  secs.push(sec(`Arkadaşlarım · ${fr.length}`,fr.map(f=>playerCard(f.other,[btn('Çıkar',()=>dropF(f.id,'Arkadaşlıktan çıkarıldı.'))])),'Henüz arkadaşın yok. Oyuncular sekmesinden istek gönder.'));

/* ---------- Profil düzenleme ---------- */
function buildProfile(){
  const p=S.profiles[S.uid];
  S.pickHue=typeof p.hue==='number'?p.hue:hue(S.uid);
  const err=h('div',{class:'err',id:'pErr',role:'alert'});
  const nick=h('input',{type:'text',id:'pNick',maxlength:'16',autocomplete:'off','aria-label':'Oyun adı'});nick.value=p.nick;
  const bio=h('textarea',{id:'pBio',maxlength:'120',placeholder:'Hangi oyunları oynuyorsun?'});bio.value=p.bio||'';
  const tr=h('input',{type:'checkbox',id:'pTr'});tr.checked=!!p.tr;
  const prev=h('div',{id:'pPrev'});
  const sw=h('div',{class:'swatches'});
  const drawPrev=()=>prev.replaceChildren(avatarH(S.pickHue,nick.value.trim()||p.nick));
  const drawSw=()=>sw.replaceChildren(...HUES.map(hv=>{
    const b=h('button',{type:'button',class:'swb','aria-label':'Avatar rengi '+hv,'aria-pressed':S.pickHue===hv?'true':'false',onclick:()=>{S.pickHue=hv;drawSw();drawPrev()}});
    b.style.background=`hsl(${hv} 52% 40%)`;return b;
  }));
  nick.addEventListener('input',drawPrev);
  const save=h('button',{class:'btn primary',type:'submit',id:'pSave',text:'Kaydet'});
  const form=h('form',{class:'pform',onsubmit:async e=>{
    e.preventDefault();
    const n=nick.value.trim();err.textContent='';
    if(!NICK_RE.test(n)||keyOf(n).length<3){err.textContent='Oyun adı 3-16 karakter olmalı; harf, rakam, _ ve - kullanabilirsin.';return}
    save.disabled=true;
    try{
      const cur=S.profiles[S.uid];
      let key=cur.key||keyOf(cur.nick);
      const nk=keyOf(n);
      if(nk!==key){
        const r=await claimNick(n);
        if(!r.ok){err.textContent=r.msg;return}
        await S.db.doc('nicks/'+key).delete().catch(()=>{});
        key=nk;
      }else if(n!==cur.nick){
        await S.db.doc('nicks/'+key).set({uid:S.uid,nick:n});
      }
      await S.db.doc('profiles/'+S.uid).update({nick:n,key,tr:tr.checked,bio:bio.value.trim().slice(0,120),hue:S.pickHue});
      toast('Profilin kaydedildi.');
      setView('genel');
    }catch(x){err.textContent=errText(x)}
    finally{save.disabled=false}
  }},
    h('div',{class:'prow'},prev,h('div',{},h('span',{class:'lab',text:'Önizleme'}),h('div',{},...tags(S.uid)))),
    h('div',{},h('label',{class:'lab',for:'pNick',text:'Oyun adı'}),nick),
    h('div',{},h('label',{class:'lab',for:'pBio',text:'Hakkında'}),bio),
    h('div',{},h('span',{class:'lab',text:'Avatar rengi'}),sw),
    h('label',{class:'row'},tr,"Türkiye'den bağlanıyorum"),
    err,
    h('div',{class:'btns'},save,h('button',{class:'btn',type:'button',onclick:()=>setView('genel'),text:'Vazgeç'})));
  drawPrev();drawSw();
  body().replaceChildren(page(h('div',{class:'scroll'},form)));
}

/* ---------- Kurucu / Yönetim paneli ---------- */
function confirmBtn(key,label,yes,o={}){
  const danger=o.danger!==false;
  if(S.confirm!==key)return btn(label,()=>{S.confirm=key;S.reason='';updatePanel()},danger?'danger':'');
  const w=h('span',{class:'confirm'});
  if(o.note)w.append(h('span',{class:'cnote2',text:o.note}));
  if(o.reason)w.append(h('input',{type:'text',class:'rin',maxlength:'80',placeholder:'Sebep (isteğe bağlı)','aria-label':'Ban sebebi',value:S.reason||'',oninput:e=>{S.reason=e.target.value}}));
  w.append(btn('Evet, '+(o.yes||label.toLowerCase()),async()=>{S.confirm=null;await yes();updatePanel()},'danger'),btn('Vazgeç',()=>{S.confirm=null;updatePanel()}));
  return w;
}
const makeMod=u=>run(()=>S.db.doc('roles/'+u).set({role:'mod',perms:{delete:true,mute:true,announce:false},since:Date.now()}),`${nickOf(u)} artık moderatör.`);
const delMod=u=>run(()=>S.db.doc('roles/'+u).delete(),`${nickOf(u)} moderatörlükten alındı.`);
const setPerm=(u,k)=>run(()=>S.db.doc('roles/'+u).update({perms:{[k]:!(S.roles[u].perms&&S.roles[u].perms[k])}}));
const banUser=u=>run(async()=>{
  await S.db.doc('bans/'+u).set({nick:nickOf(u),reason:(S.reason||'').trim().slice(0,80),at:Date.now()});
  if(isMod(u))await S.db.doc('roles/'+u).delete();
},`${nickOf(u)} banlandı.`);
const unbanUser=u=>run(()=>S.db.doc('bans/'+u).delete(),'Ban kaldırıldı.');
async function deleteUserMsgs(u){
  for(const c of chatCh()){
    const sn=await S.db.collection('msg_'+c.id).where('uid','==',u).limit(1000).get();
    for(const d of sn.docs)await S.db.doc(`msg_${c.id}/${d.id}`).delete();
  }
}
const saveChan=(chat,voice)=>S.db.doc('meta/channels').set({chat,voice});
function addChan(kind,name){
  const t=(name||'').trim().slice(0,24);
  if(t.length<2){toast('Kanal adı en az 2 karakter olmalı.');return}
  const list=kind==='chat'?chatCh():voiceCh();
  if(list.length>=12){toast('En fazla 12 kanal ekleyebilirsin.');return}
  const id='c-'+(keyOf(t)||'kanal').slice(0,16)+'-'+Math.random().toString(36).slice(2,6);
  const next=[...list,{id,t,s:'',tr:false}];
  return run(()=>saveChan(kind==='chat'?next:chatCh(),kind==='voice'?next:voiceCh()),'Kanal eklendi.');
}
function delChan(kind,id){
  const list=kind==='chat'?chatCh():voiceCh();
  if(list.length<=1)return;
  return run(async()=>{
    const next=list.filter(c=>c.id!==id);
    await saveChan(kind==='chat'?next:chatCh(),kind==='voice'?next:voiceCh());
    if(kind==='chat'){
      const sn=await S.db.collection('msg_'+id).limit(1000).get();
      for(const d of sn.docs)await S.db.doc(`msg_${id}/${d.id}`).delete();
    }
  },'Kanal silindi.');
}
async function deleteAccount(u){
  const p=S.profiles[u];
  toast('Hesap siliniyor…');
  try{
    await deleteUserMsgs(u);
    for(const fld of['from','to']){
      const s=await S.db.collection('freq').where(fld,'==',u).limit(500).get();
      for(const d of s.docs)await S.db.doc('freq/'+d.id).delete();
    }
    await S.db.doc('roles/'+u).delete();
    await S.db.doc('mutes/'+u).delete();
    if(p&&p.key)await S.db.doc('nicks/'+p.key).delete();
    await S.db.doc('profiles/'+u).delete();
    toast(`${p?p.nick:'Hesap'} silindi.`);
  }catch(e){toast(errText(e))}
}
async function clearChannel(ch){
  try{
    const s=await S.db.collection('msg_'+ch).orderBy('ts','desc').limit(1000).get();
    const old=s.docs.slice(50);
    for(const d of old)await S.db.doc(`msg_${ch}/${d.id}`).delete();
    toast(old.length?`${old.length} eski mesaj temizlendi.`:'Temizlenecek eski mesaj yok.');
  }catch(e){toast(errText(e))}
}

function adminRow(u){
  const p=S.profiles[u],on=onlineSet().has(u),banned=!!S.bans[u],mod=isMod(u),self=u===S.uid;
  const mu=S.mutes[u],muted=mu&&mu.until>Date.now();
  const status=[h('span',{class:'dot'+(on?' on':'')}),h('strong',{text:p.nick}),...tags(u)];
  if(banned)status.push(h('span',{class:'chip bad',text:'Banlı'}));
  if(muted)status.push(h('span',{class:'chip bad',text:'Susturulmuş'}));
  const acts=[];
  if(self||u===S.founderUid){acts.push(h('span',{class:'mute',text:self?'Sen':'Kurucu'}))}
  else{
    acts.push(btn(mod?'Moderatörlüğü al':'Moderatör yap',()=>mod?delMod(u):makeMod(u)));
    if(banned)acts.push(btn('Banı kaldır',()=>unbanUser(u)));
    else acts.push(confirmBtn('ban:'+u,'Banla',()=>banUser(u),{reason:true,yes:'banla'}));
    acts.push(confirmBtn('msgs:'+u,'Mesajlarını sil',()=>run(()=>deleteUserMsgs(u),`${nickOf(u)} kullanıcısının mesajları silindi.`),{yes:'mesajları sil'}));
    acts.push(confirmBtn('del:'+u,'Hesabı sil',()=>deleteAccount(u),{note:'Profil, mesajlar ve arkadaşlıklar silinir.',yes:'hesabı sil'}));
  }
  const card=h('div',{class:'pcard'},
    avatar(u,p.nick),
    h('div',{class:'who'},
      h('div',{class:'top2'},...status),
      h('div',{class:'sub','data-acct':u,text:'Hesap: …'}),
      h('div',{class:'sub',text:`Katılım: ${fmtD(p.createdAt)}`})),
    h('div',{class:'acts'},...acts));
  if(mod&&!self){
    const pr=S.roles[u].perms||{};
    card.append(h('div',{class:'perms'},h('span',{class:'lab',text:'Yetkiler'}),
      ...[['delete','Mesaj sil'],['mute','Sustur'],['announce','Duyuru']].map(([k,l])=>
        h('button',{type:'button',class:'btn sm','aria-pressed':pr[k]?'true':'false',onclick:()=>setPerm(u,k),text:l}))));
  }
  return card;
}

async function boot(){
  showGate('loading');
  const c=window.claude;
  if(!c||!c.use){showGate('closed');return}
  let db=null,user=null,room=null;
  try{[db,user,room]=await Promise.all([c.use('db'),c.use('user'),c.use('room')])}catch(e){}
  if(!db||!user){showGate('closed');return}
  S.db=db;S.user=user;S.room=room;
  S.uid=await user.id();
  if(!S.uid){showGate('closed');return}
  S.isOwner=await user.isOwner();S.canWrite=await user.can('data.write');
  try{S.loggedOut=localStorage.getItem('alors_out_'+S.uid)==='1'}catch(e){}
  if(S.loggedOut&&S.room)S.room.presence({out:true}).catch(()=>{});
  const onErr=e=>{S.err=e;decide()};
  const col=n=>db.collection(n);
  const mapDocs=(key,flag)=>s=>{const o={};s.docs.forEach(d=>{o[d.id]=d.data()});S[key]=o;if(flag)S.loaded[flag]=true;decide()};
  col('profiles').limit(500).onSnapshot(mapDocs('profiles','profiles'),onErr);
  col('bans').limit(500).onSnapshot(mapDocs('bans','bans'),onErr);
  col('roles').limit(200).onSnapshot(mapDocs('roles'),onErr);
  col('mutes').limit(200).onSnapshot(mapDocs('mutes'),onErr);
  db.doc('announce/current').onSnapshot(d=>{S.announce=d.exists?d.data():null;decide()},onErr);
  db.doc('meta/founder').onSnapshot(d=>{
    S.founderUid=d.exists?d.data().uid:null;
    if(S.isOwner&&S.founderUid!==S.uid&&!S.wroteFounder){S.wroteFounder=true;db.doc('meta/founder').set({uid:S.uid}).catch(()=>{})}
    decide();
  },onErr);
  db.doc('voice/links').onSnapshot(d=>{S.vlinks=d.exists?d.data():{};if(S.shellOn&&S.view==='ses')updateVoice()},onErr);
  db.doc('meta/channels').onSnapshot(d=>{
    S.chan=d.exists?cleanChan(d.data()):{};
    syncMsgSubs();
    if(S.shellOn&&!RESERVED.includes(S.view)&&!isChat(S.view)){setView(chatCh()[0].id);return}
    decide();
  },onErr);
  col('voice_assign').limit(500).onSnapshot(sn=>{
    const o={};sn.docs.forEach(d=>{o[d.id]=d.data()});S.vassign=o;
    applyAssign();
    if(S.shellOn&&S.view==='ses')updateVoice();
  },onErr);
  syncMsgSubs();
  col('freq').where('from','==',S.uid).onSnapshot(s=>{S.freqOut=s.docs.map(d=>({id:d.id,...d.data()}));decide()},onErr);
  col('freq').where('to','==',S.uid).onSnapshot(s=>{S.freqIn=s.docs.map(d=>({id:d.id,...d.data()}));decide()},onErr);
  setInterval(()=>{if(S.shellOn)updateLock()},15000);
}
boot();
})();
</script>
